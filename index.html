<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Legends Tournament Leaderboard</title>
    <!-- Google Fonts: Rajdhani & Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: linear-gradient(rgba(10, 10, 14, 0.88), rgba(10, 10, 14, 0.94)), 
                        url('https://images7.alphacoders.com/132/thumb-1920-1325463.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff; 
            font-family: 'Rajdhani', sans-serif; 
            text-align: center; 
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .ticker-bar {
            background: rgba(198, 48, 49, 0.9);
            color: #fff;
            padding: 8px 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 2px 10px rgba(255, 62, 62, 0.3);
        }

        .container {
            max-width: 1000px;
            margin: 30px auto 0;
            padding: 0 20px;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(231, 76, 60, 0.6);
            margin-bottom: 5px;
        }

        .header-subtitle {
            color: #ff4747;
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 30px;
            font-weight: 700;
        }

        /* Champion Spotlight Card */
        .champion-card {
            background: linear-gradient(135deg, rgba(255, 71, 71, 0.2) 0%, rgba(20, 20, 26, 0.9) 100%);
            border: 2px solid #ff4747;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 0 25px rgba(255, 71, 71, 0.25);
            clip-path: polygon(0 0, 100% 0, 97% 100%, 0% 100%);
        }

        .champion-info { text-align: left; }
        .champion-badge { 
            font-family: 'Orbitron', sans-serif;
            background: #ff4747;
            color: #fff;
            padding: 4px 12px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            border-radius: 3px;
            display: inline-block;
            margin-bottom: 8px;
        }
        .champion-name { font-size: 2.2rem; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
        .champion-score { font-size: 2.5rem; font-family: 'Orbitron', sans-serif; color: #ffbc00; }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid #444;
            border-left: 4px solid #ff4747;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            border-radius: 4px;
            outline: none;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: #ff4747;
            box-shadow: 0 0 12px rgba(255, 71, 71, 0.4);
        }

        /* Leaderboard Table */
        .table-container {
            background: rgba(18, 18, 24, 0.9);
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }
        th { 
            background: #191921; 
            color: #ff4747; 
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 1.5px;
            padding: 16px;
            text-transform: uppercase;
            border-bottom: 2px solid #ff4747;
        }
        
        td { padding: 16px; font-size: 1.2rem; font-weight: 600; }
        tr.main-row { border-bottom: 1px solid rgba(255, 255, 255, 0.05); transition: 0.2s; cursor: pointer; }
        tr.main-row:hover { background: rgba(255, 71, 71, 0.12); }

        /* Rank Badges */
        .rank-cell { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; }
        .rank-1 { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .rank-2 { color: #c0c0c0; text-shadow: 0 0 10px rgba(192, 192, 192, 0.5); }
        .rank-3 { color: #cd7f32; text-shadow: 0 0 10px rgba(205, 127, 50, 0.5); }

        /* Status Animations */
        .status-wrapper { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        .status-in-match .status-dot { background-color: #2ecc71; animation: pulse-green 1.5s infinite; }
        .status-eliminated .status-dot { background-color: #e74c3c; }
        .status-waiting .status-dot { background-color: #95a5a6; }

        /* Expandable Player Details Row */
        .details-row { display: none; background: rgba(10, 10, 15, 0.95); }
        .details-row.open { display: table-row; }
        
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            padding: 15px 25px;
            text-align: left;
        }

        .player-card {
            background: rgba(30, 30, 40, 0.8);
            border-left: 3px solid #ff4747;
            padding: 10px 15px;
            border-radius: 4px;
        }

        .player-title {
            font-size: 0.75rem;
            color: #888;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }

        .player-stats {
            font-size: 1.1rem;
            color: #fff;
            font-weight: 700;
        }

        .toggle-icon {
            font-size: 0.8rem;
            color: #ff4747;
            margin-left: 8px;
            transition: transform 0.3s ease;
            display: inline-block;
        }

        .toggle-icon.rotated { transform: rotate(90deg); }
    </style>
</head>
<body>

    <div class="ticker-bar">
        ⚡ LIVE BROADCAST • APEX LEGENDS UNIVERSITY CHAMPIONSHIP ⚡
    </div>

    <div class="container">
        <h1 class="header-title">APEX LEGENDS</h1>
        <div class="header-subtitle">Tournament Leaderboard</div>

        <div class="champion-card" id="champion-card">
            <div class="champion-info">
                <span class="champion-badge">🏆 CURRENT LEADER</span>
                <div class="champion-name" id="champ-name">Loading...</div>
            </div>
            <div class="champion-score" id="champ-score">-- PTS</div>
        </div>

        <div class="controls">
            <input type="text" id="search-bar" class="search-input" placeholder="🔍 Search team name..." onkeyup="filterTeams()">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Team Name</th>
                        <th>Kills</th>
                        <th>Placement</th>
                        <th>Total Score</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Dynamic Data Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Direct CSV Published URL
        const csvUrl = 'https://docs.google.com/spreadsheets/d/1RB6RdDieEWf5MBorERKsL9nWbt6qc01rY_5aCyNZjPA/edit?gid=0#gid=0'; 

        let globalData = [];

        async function fetchLeaderboard() {
            try {
                // Add timestamp parameter and no-cache option to bypass browser and CDN caching
                const cacheBustUrl = csvUrl + (csvUrl.includes('?') ? '&' : '?') + '_t=' + Date.now();
                const response = await fetch(cacheBustUrl, { 
                    cache: 'no-store',
                    headers: {
                        'Pragma': 'no-cache',
                        'Cache-Control': 'no-cache'
                    }
                });
                if (!response.ok) return; 
                
                const csvText = await response.text();
                const rows = csvText.split('\n'); 
                globalData = [];

                for (let i = 1; i < rows.length; i++) { 
                    if (!rows[i].trim()) continue; 
                    
                    const cols = rows[i].split(',').map(col => col.replace(/^"(.*)"$/, '$1').trim());
                    
                    const kills = parseInt(cols[1]) || 0;
                    const placement = parseInt(cols[2]) || 0;
                    // Auto-calculate total if column D isn't updated manually
                    const totalCalculated = kills + placement;
                    const totalCol = parseInt(cols[3]);
                    const total = !isNaN(totalCol) && totalCol > 0 ? totalCol : totalCalculated;

                    globalData.push({
                        name: cols[0] || 'Unknown',
                        kills: kills,
                        placement: placement,
                        total: total,
                        status: cols[4] || 'Waiting',
                        p1: cols[5] || 'N/A',
                        p2: cols[6] || 'N/A',
                        p3: cols[7] || 'N/A'
                    });
                }

                // Automatically sort teams by total score descending so ranks adjust live
                globalData.sort((a, b) => b.total - a.total);

                if (globalData.length > 0) {
                    document.getElementById('champ-name').textContent = globalData[0].name;
                    document.getElementById('champ-score').textContent = globalData[0].total + ' PTS';
                }

                renderTable(globalData);
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = ''; 

            data.forEach((team, index) => {
                let rankDisplay = `#${index + 1}`;
                let rankClass = '';
                if (index === 0) { rankDisplay = '🥇 #1'; rankClass = 'rank-1'; }
                else if (index === 1) { rankDisplay = '🥈 #2'; rankClass = 'rank-2'; }
                else if (index === 2) { rankDisplay = '🥉 #3'; rankClass = 'rank-3'; }

                const statusClass = team.status.toLowerCase().replace(/\s+/g, '-');
                const detailId = `details-${index}`;
                const arrowId = `arrow-${index}`;

                // Main Team Row
                const mainTr = document.createElement('tr');
                mainTr.className = 'main-row';
                mainTr.onclick = () => toggleDetails(detailId, arrowId);
                
                mainTr.innerHTML = `
                    <td class="rank-cell ${rankClass}">${rankDisplay}</td>
                    <td style="text-align: left; padding-left: 25px;">
                        ${team.name} <span id="${arrowId}" class="toggle-icon">▶</span>
                    </td>
                    <td>${team.kills}</td>
                    <td>${team.placement}</td>
                    <td style="color: #ffbc00; font-weight: 700;">${team.total}</td>
                    <td>
                        <div class="status-wrapper status-${statusClass}">
                            <div class="status-dot"></div>
                            <span>${team.status}</span>
                        </div>
                    </td>
                `;

                // Expandable Sub-Row (Player KDA Roster)
                const detailTr = document.createElement('tr');
                detailTr.id = detailId;
                detailTr.className = 'details-row';
                detailTr.innerHTML = `
                    <td colspan="6">
                        <div class="player-grid">
                            <div class="player-card">
                                <div class="player-title">Player 1</div>
                                <div class="player-stats">${team.p1}</div>
                            </div>
                            <div class="player-card">
                                <div class="player-title">Player 2</div>
                                <div class="player-stats">${team.p2}</div>
                            </div>
                            <div class="player-card">
                                <div class="player-title">Player 3</div>
                                <div class="player-stats">${team.p3}</div>
                            </div>
                        </div>
                    </td>
                `;

                tbody.appendChild(mainTr);
                tbody.appendChild(detailTr);
            });
        }

        function toggleDetails(detailId, arrowId) {
            const detailRow = document.getElementById(detailId);
            const arrow = document.getElementById(arrowId);
            
            detailRow.classList.toggle('open');
            arrow.classList.toggle('rotated');
        }

        function filterTeams() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const filtered = globalData.filter(team => team.name.toLowerCase().includes(query));
            renderTable(filtered);
        }

        fetchLeaderboard();
        // Reduced interval from 15 seconds to 3 seconds for faster live updates
        setInterval(fetchLeaderboard, 3000); 
    </script>
</body>
</html>
